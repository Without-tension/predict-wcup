name: Cron Match Sync

on:
  schedule:
    # 🌍 UTC час: 06:00 UTC = 09:00 за Києвом (літо) / 08:00 (зима)
    # 🌍 UTC час: 15:00 UTC = 18:00 за Києвом
    - cron: '0 6 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: # Дозволяє запускати синхронізацію вручну кнопкою на GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests supabase

    - name: Run sync script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python sync_matches.py